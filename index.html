<script>
  const DATA_URL = "./data.json";
  const REFRESH_MS = 60_000;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[character]);
  }

  function machineCategory(state) {
    const value = (state || "").trim();

    if (value.toLowerCase() === "running") return "running";
    if (value.toLowerCase() === "disconnected") return "disconnected";
    if (value.toLowerCase() === "startup") return "startup";
    if (!value) return "no-job";

    const hasDate = /\d{1,4}[-/]\d{1,2}[-/]\d{1,4}/.test(value);
    const hasTime = /\d{1,2}:\d{2}/.test(value);
    if (hasDate && hasTime) return "stop";

    return "other";
  }

  function currentShift() {
    const hour = new Date().getHours();
    return hour >= 7 && hour < 19 ? "Turno 1" : "Turno 2";
  }

  function updateDateAndShift() {
    const now = new Date();
    const formattedDate = new Intl.DateTimeFormat("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }).format(now);

    document.getElementById("dateShift").textContent =
      `Date: ${formattedDate} | Shift: ${currentShift()}`;
  }

  function renderTable(targetId, rows, columnCount, formatter) {
    const body = document.getElementById(targetId);

    if (!rows.length) {
      body.innerHTML =
        `<tr class="empty-row"><td colspan="${columnCount}">No records.</td></tr>`;
      return;
    }

    body.innerHTML = rows.map(formatter).join("");
  }

  function renderDashboard(data) {
    const machines = Array.isArray(data.machines) ? data.machines : [];
    const alerts = Array.isArray(data.alerts) ? data.alerts : [];

    const counts = {
      running: 0,
      stop: 0,
      startup: 0,
      "no-job": 0,
      disconnected: 0
    };

    const categories = {
      stop: [],
      startup: [],
      disconnected: []
    };

    for (const machine of machines) {
      const category = machineCategory(machine.state);

      if (Object.prototype.hasOwnProperty.call(counts, category)) {
        counts[category] += 1;
      }

      if (categories[category]) {
        categories[category].push(machine);
      }
    }

    document.getElementById("kpi-running").textContent = counts.running;
    document.getElementById("kpi-stop").textContent = counts.stop;
    document.getElementById("kpi-startup").textContent = counts.startup;
    document.getElementById("kpi-no-job").textContent = counts["no-job"];
    document.getElementById("kpi-disconnected").textContent =
      counts.disconnected;

    renderTable("stopRows", categories.stop, 4, machine => `
      <tr>
        <td>${escapeHtml(machine.name)}</td>
        <td>${escapeHtml(machine.mold || "-")}</td>
        <td>${escapeHtml(machine.state)}</td>
        <td>${escapeHtml(machine.cycle || "-")}</td>
      </tr>
    `);

    renderTable("startupRows", categories.startup, 4, machine => `
      <tr>
        <td>${escapeHtml(machine.name)}</td>
        <td>${escapeHtml(machine.mold || "-")}</td>
        <td>Startup</td>
        <td>${escapeHtml(machine.cycle || "-")}</td>
      </tr>
    `);

    renderTable("disconnectedRows", categories.disconnected, 6, machine => `
      <tr>
        <td>${escapeHtml(machine.name)}</td>
        <td>${escapeHtml(machine.mold || "-")}</td>
        <td>${escapeHtml(machine.ip || "-")}</td>
        <td>—</td>
        <td>${currentShift()}</td>
        <td>Review by Process Engineering</td>
      </tr>
    `);

    renderTable("alertRows", alerts, 4, alert => `
      <tr>
        <td>${escapeHtml(alert.type)}</td>
        <td>${escapeHtml(alert.value)}</td>
        <td>${escapeHtml(alert.records)}</td>
        <td>${escapeHtml(alert.description)}</td>
      </tr>
    `);

    document.getElementById("alertFooter").hidden = alerts.length === 0;

    const previewNotice = document.querySelector(".preview-notice");
    previewNotice.textContent =
      "Test data loaded from data.json. These are illustrative records, not live eDart data.";

    const updatedAt = data.updated_at
      ? new Date(data.updated_at)
      : new Date();

    document.getElementById("lastUpdated").textContent =
      `Last Updated: ${Number.isNaN(updatedAt.getTime())
        ? "Timestamp unavailable"
        : updatedAt.toLocaleString()}`;
  }

  async function loadDashboardData() {
    const lastUpdated = document.getElementById("lastUpdated");

    try {
      lastUpdated.textContent = "Last Updated: Loading data...";

      const response = await fetch(
        `${DATA_URL}?cache=${Date.now()}`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      renderDashboard(data);
    } catch (error) {
      lastUpdated.textContent = "Last Updated: Data unavailable";
      document.querySelector(".preview-notice").textContent =
        "Could not load data.json. Check the GitHub Pages deployment.";
      console.error("Dashboard data load failed:", error);
    }
  }

  updateDateAndShift();
  loadDashboardData();

  setInterval(() => {
    updateDateAndShift();
    loadDashboardData();
  }, REFRESH_MS);
</script>
