<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Status Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      color: #1f293d;
    }
    header {
      background: #000000;
      color: white;
      padding: 24px 30px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    main {
      margin: 28px;
      padding: 22px;
      background: white;
      border-radius: 10px;
    }
    .status {
      color: #52627a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Machine Status Dashboard</h1>
    <div>Information analyzed from the eDart system</div>
  </header>
  <main>
    <h2>Dashboard connection test</h2>
    <p class="status">
      GitHub Pages is publishing this site. Live eDart data will be connected
      in a later step.
    </p>
  </main>
</body>
</html>
